<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RaPaX™ Operator Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#11161d;--panel:#161e29;--border:#242f3e;
  --gold:#dcae3f;--gold2:#ffd166;--iron:#7e8f9f;
  --chalk:#cfd6dd;--white:#f5f7fa;--danger:#c0392b;
  --font:'Fira Code',Courier,monospace
}
body{background:var(--bg);color:var(--chalk);font-family:var(--font);font-size:13px;min-height:100vh}
a{color:var(--gold);text-decoration:none}
input,select,textarea{background:#0d1117;border:1px solid var(--border);color:var(--chalk);font-family:var(--font);font-size:13px;padding:8px 10px;border-radius:3px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
button{font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 18px;border:none;border-radius:3px;cursor:pointer}
.btn-gold{background:var(--gold);color:#0d1117}
.btn-gold:hover{background:var(--gold2)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--iron)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-danger{background:var(--danger);color:#fff}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:40px;width:100%;max-width:380px}
.login-box h1{color:var(--gold);font-size:20px;letter-spacing:.12em;margin-bottom:4px}
.login-box p{color:var(--iron);font-size:11px;margin-bottom:28px}
.login-box label{display:block;color:var(--iron);font-size:11px;margin-bottom:6px;margin-top:16px}
.login-box button{width:100%;margin-top:24px;padding:11px}
#login-error{color:var(--danger);font-size:11px;margin-top:10px;display:none}

/* SHELL */
#shell{display:none;flex-direction:column;min-height:100vh}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
header h1{color:var(--gold);font-size:15px;letter-spacing:.1em}
header span{color:var(--iron);font-size:11px}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--panel)}
.tab-bar button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--iron);font-family:var(--font);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:12px 20px;cursor:pointer}
.tab-bar button.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-bar button:hover:not(.active){color:var(--chalk)}
.pane{display:none;padding:24px 20px}
.pane.active{display:block}

/* CARDS / TABLES */
.card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:20px;margin-bottom:16px}
.card h3{color:var(--gold);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{color:var(--iron);font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid #1a2330;font-size:12px;vertical-align:top}
tr:hover td{background:#1a2330}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px}
.badge-green{background:#1a3a2a;color:#4caf82}
.badge-red{background:#3a1a1a;color:#e07070}
.badge-yellow{background:#3a2f10;color:var(--gold)}
.badge-blue{background:#1a2a3a;color:#70a0e0}
.price{color:var(--gold);font-weight:700}
.mono{font-family:var(--font)}
.actions{display:flex;gap:6px;flex-wrap:wrap}

/* FORM ROW */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.single{grid-template-columns:1fr}
label.field{display:block;color:var(--iron);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--gold);color:var(--gold);font-size:12px;padding:12px 20px;border-radius:4px;display:none;z-index:999;max-width:320px}
#toast.err{border-color:var(--danger);color:var(--danger)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:6px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{color:var(--gold);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.modal-head button{background:none;border:none;color:var(--iron);font-size:18px;cursor:pointer;padding:0}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

.empty{color:var(--iron);font-size:12px;padding:20px 0;text-align:center}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#0d1117;border:1px solid var(--border);border-radius:4px;padding:14px 16px}
.stat .val{color:var(--gold);font-size:22px;font-weight:700}
.stat .lbl{color:var(--iron);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>// RAPAX™</h1>
    <p>OPERATOR CONTROL PANEL — RESTRICTED ACCESS</p>
    <label>Operator Secret</label>
    <input type="password" id="secret-input" placeholder="Enter operator secret" autocomplete="current-password"/>
    <div id="login-error">Invalid credentials.</div>
    <button class="btn-gold" onclick="doLogin()">AUTHENTICATE</button>
  </div>
</div>

<!-- SHELL -->
<div id="shell">
  <header>
    <h1>// RAPAX™ OPERATOR</h1>
    <span id="hdr-status">CONNECTED</span>
  </header>
  <div class="tab-bar">
    <button class="active" onclick="switchTab('products')">PRODUCTS</button>
    <button onclick="switchTab('transactions')">TRANSACTIONS</button>
    <button onclick="switchTab('deliveries')">DELIVERIES</button>
    <button onclick="switchTab('audit')">AUDIT LOG</button>
    <button onclick="doLogout()" style="margin-left:auto;color:var(--danger)">LOGOUT</button>
  </div>

  <!-- PRODUCTS -->
  <div id="pane-products" class="pane active">
    <div class="stat-grid" id="product-stats"></div>
    <div class="card">
      <h3>▸ ADD PRODUCT</h3>
      <div class="form-row">
        <div><label class="field">Name</label><input id="p-name" placeholder="Product name"/></div>
        <div><label class="field">Version</label><input id="p-version" placeholder="1.0.0"/></div>
      </div>
      <div class="form-row single"><label class="field">Description</label><textarea id="p-desc" rows="2" placeholder="Short description"></textarea></div>
      <div class="form-row">
        <div><label class="field">Price (USD)</label><input id="p-price" type="number" step="0.01" placeholder="0.00"/></div>
        <div><label class="field">Category</label><select id="p-cat"><option>software</option><option>document</option><option>template</option><option>data</option><option>other</option></select></div>
      </div>
      <div class="form-row single"><label class="field">File</label><input id="p-file" type="file"/></div>
      <button class="btn-gold" onclick="addProduct()">+ ADD PRODUCT</button>
    </div>
    <div class="card">
      <h3>▸ CATALOG</h3>
      <div id="product-table-wrap"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <!-- TRANSACTIONS -->
  <div id="pane-transactions" class="pane">
    <div class="card">
      <h3>▸ RECENT TRANSACTIONS</h3>
      <div id="tx-table-wrap"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <!-- DELIVERIES -->
  <div id="pane-deliveries" class="pane">
    <div class="card">
      <h3>▸ DELIVERY LOG</h3>
      <div id="del-table-wrap"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <!-- AUDIT -->
  <div id="pane-audit" class="pane">
    <div class="card">
      <h3>▸ AUDIT LOG</h3>
      <div id="audit-table-wrap"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-bg" id="edit-modal">
  <div class="modal">
    <div class="modal-head"><h3>EDIT PRODUCT</h3><button onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="e-id"/>
      <div class="form-row">
        <div><label class="field">Name</label><input id="e-name"/></div>
        <div><label class="field">Version</label><input id="e-version"/></div>
      </div>
      <div class="form-row single"><label class="field">Description</label><textarea id="e-desc" rows="2"></textarea></div>
      <div class="form-row">
        <div><label class="field">Price (USD)</label><input id="e-price" type="number" step="0.01"/></div>
        <div><label class="field">Category</label><select id="e-cat"><option>software</option><option>document</option><option>template</option><option>data</option><option>other</option></select></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeModal()">CANCEL</button>
      <button class="btn-gold" onclick="saveEdit()">SAVE</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '';
let JWT = sessionStorage.getItem('rapax_jwt') || '';
if (JWT) showShell();

function hdr(){ return { 'Authorization':'Bearer '+JWT, 'Content-Type':'application/json' }; }

async function doLogin(){
  const secret = document.getElementById('secret-input').value.trim();
  if(!secret) return;
  try{
    const r = await fetch(API+'/api/operator/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret})});
    const d = await r.json();
    if(d.token){ JWT=d.token; sessionStorage.setItem('rapax_jwt',JWT); showShell(); }
    else{ document.getElementById('login-error').style.display='block'; }
  }catch(e){ document.getElementById('login-error').style.display='block'; }
}

document.getElementById('secret-input').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

function showShell(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('shell').style.display='flex';
  loadProducts(); loadTransactions(); loadDeliveries(); loadAudit();
}

function doLogout(){
  JWT=''; sessionStorage.removeItem('rapax_jwt');
  location.reload();
}

function switchTab(name){
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-bar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('pane-'+name).classList.add('active');
  event.target.classList.add('active');
}

function toast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=err?'err':'';
  t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}

// ── PRODUCTS ─────────────────────────────────────────────────────
async function loadProducts(){
  try{
    const r=await fetch(API+'/api/products');
    const d=await r.json();
    const prods=d.products||d||[];
    renderProductStats(prods);
    renderProductTable(prods);
  }catch(e){ document.getElementById('product-table-wrap').innerHTML='<div class="empty">Failed to load.</div>'; }
}

function renderProductStats(prods){
  const avail=prods.filter(p=>p.available!==0).length;
  document.getElementById('product-stats').innerHTML=`
    <div class="stat"><div class="val">${prods.length}</div><div class="lbl">Total Products</div></div>
    <div class="stat"><div class="val">${avail}</div><div class="lbl">Available</div></div>
    <div class="stat"><div class="val">${prods.length-avail}</div><div class="lbl">Hidden</div></div>`;
}

function renderProductTable(prods){
  if(!prods.length){ document.getElementById('product-table-wrap').innerHTML='<div class="empty">No products yet.</div>'; return; }
  let rows=prods.map(p=>`
    <tr>
      <td>${p.name||'—'}</td>
      <td><span class="badge badge-blue">${p.version||'—'}</span></td>
      <td>${p.category||'—'}</td>
      <td class="price">$${Number(p.price_usd||0).toFixed(2)}</td>
      <td>${(p.available!==0)?'<span class="badge badge-green">LIVE</span>':'<span class="badge badge-red">HIDDEN</span>'}</td>
      <td><div class="actions">
        <button class="btn-ghost" onclick="openEdit(${JSON.stringify(p).replace(/"/g,'&quot;')})">EDIT</button>
        <button class="btn-ghost" onclick="toggleProduct(${p.id},${p.available})">TOGGLE</button>
        <button class="btn-danger" onclick="deleteProduct(${p.id})">DEL</button>
      </div></td>
    </tr>`).join('');
  document.getElementById('product-table-wrap').innerHTML=`
    <table><thead><tr><th>Name</th><th>Ver</th><th>Cat</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

async function addProduct(){
  const name=document.getElementById('p-name').value.trim();
  const price=document.getElementById('p-price').value;
  const file=document.getElementById('p-file').files[0];
  if(!name||!price){ toast('Name and price required.',true); return; }
  const fd=new FormData();
  fd.append('name',name);
  fd.append('version',document.getElementById('p-version').value||'1.0.0');
  fd.append('description',document.getElementById('p-desc').value);
  fd.append('price_usd',price);
  fd.append('category',document.getElementById('p-cat').value);
  if(file) fd.append('file',file);
  try{
    const r=await fetch(API+'/api/operator/products',{method:'POST',headers:{'Authorization':'Bearer '+JWT},body:fd});
    const d=await r.json();
    if(r.ok){ toast('Product added.'); loadProducts(); ['p-name','p-version','p-desc','p-price'].forEach(id=>document.getElementById(id).value=''); }
    else toast(d.error||'Failed.',true);
  }catch(e){ toast('Network error.',true); }
}

function openEdit(p){
  document.getElementById('e-id').value=p.id;
  document.getElementById('e-name').value=p.name||'';
  document.getElementById('e-version').value=p.version||'';
  document.getElementById('e-desc').value=p.description||'';
  document.getElementById('e-price').value=p.price_usd||'';
  document.getElementById('e-cat').value=p.category||'software';
  document.getElementById('edit-modal').classList.add('open');
}

function closeModal(){ document.getElementById('edit-modal').classList.remove('open'); }

async function saveEdit(){
  const id=document.getElementById('e-id').value;
  const body={name:document.getElementById('e-name').value,version:document.getElementById('e-version').value,description:document.getElementById('e-desc').value,price_usd:document.getElementById('e-price').value,category:document.getElementById('e-cat').value};
  try{
    const r=await fetch(API+'/api/operator/products/'+id,{method:'PATCH',headers:hdr(),body:JSON.stringify(body)});
    const d=await r.json();
    if(r.ok){ toast('Saved.'); closeModal(); loadProducts(); }
    else toast(d.error||'Failed.',true);
  }catch(e){ toast('Network error.',true); }
}

async function toggleProduct(id,cur){
  try{
    const r=await fetch(API+'/api/operator/products/'+id,{method:'PATCH',headers:hdr(),body:JSON.stringify({available:cur?0:1})});
    if(r.ok){ toast('Toggled.'); loadProducts(); }
    else toast('Failed.',true);
  }catch(e){ toast('Error.',true); }
}

async function deleteProduct(id){
  if(!confirm('Delete this product? This cannot be undone.')) return;
  try{
    const r=await fetch(API+'/api/operator/products/'+id,{method:'DELETE',headers:hdr()});
    if(r.ok){ toast('Deleted.'); loadProducts(); }
    else toast('Failed.',true);
  }catch(e){ toast('Error.',true); }
}

// ── TRANSACTIONS ────────────────────────────────────────────────
async function loadTransactions(){
  try{
    const r=await fetch(API+'/api/operator/transactions',{headers:hdr()});
    const d=await r.json();
    const txs=d.transactions||d||[];
    if(!txs.length){ document.getElementById('tx-table-wrap').innerHTML='<div class="empty">No transactions yet.</div>'; return; }
    let rows=txs.map(t=>`<tr>
      <td class="mono">${t.id}</td>
      <td>${t.product_name||t.product_id||'—'}</td>
      <td class="price">$${Number(t.amount_usd||0).toFixed(2)}</td>
      <td><span class="badge badge-yellow">${t.currency||'—'}</span></td>
      <td><span class="badge ${t.status==='confirmed'?'badge-green':t.status==='pending'?'badge-yellow':'badge-red'}">${(t.status||'').toUpperCase()}</span></td>
      <td class="mono" style="font-size:10px">${t.buyer_email||'—'}</td>
      <td style="font-size:10px">${t.created_at?new Date(t.created_at).toLocaleString():'—'}</td>
    </tr>`).join('');
    document.getElementById('tx-table-wrap').innerHTML=`<table><thead><tr><th>ID</th><th>Product</th><th>USD</th><th>Coin</th><th>Status</th><th>Buyer</th><th>Date</th></tr></thead><tbody>${rows}</tbody></table>`;
  }catch(e){ document.getElementById('tx-table-wrap').innerHTML='<div class="empty">Failed to load.</div>'; }
}

// ── DELIVERIES ──────────────────────────────────────────────────
async function loadDeliveries(){
  try{
    const r=await fetch(API+'/api/operator/deliveries',{headers:hdr()});
    const d=await r.json();
    const dels=d.deliveries||d||[];
    if(!dels.length){ document.getElementById('del-table-wrap').innerHTML='<div class="empty">No deliveries yet.</div>'; return; }
    let rows=dels.map(d=>`<tr>
      <td class="mono">${d.id}</td>
      <td>${d.product_name||d.product_id||'—'}</td>
      <td class="mono" style="font-size:10px">${d.buyer_email||'—'}</td>
      <td><span class="badge ${d.status==='delivered'?'badge-green':'badge-yellow'}">${(d.status||'').toUpperCase()}</span></td>
      <td style="font-size:10px">${d.delivered_at?new Date(d.delivered_at).toLocaleString():'—'}</td>
    </tr>`).join('');
    document.getElementById('del-table-wrap').innerHTML=`<table><thead><tr><th>ID</th><th>Product</th><th>Buyer</th><th>Status</th><th>Delivered</th></tr></thead><tbody>${rows}</tbody></table>`;
  }catch(e){ document.getElementById('del-table-wrap').innerHTML='<div class="empty">Failed to load.</div>'; }
}

// ── AUDIT LOG ───────────────────────────────────────────────────
async function loadAudit(){
  try{
    const r=await fetch(API+'/api/operator/audit',{headers:hdr()});
    const d=await r.json();
    const logs=d.logs||d||[];
    if(!logs.length){ document.getElementById('audit-table-wrap').innerHTML='<div class="empty">No audit entries yet.</div>'; return; }
    let rows=logs.map(l=>`<tr>
      <td style="font-size:10px">${l.created_at?new Date(l.created_at).toLocaleString():'—'}</td>
      <td><span class="badge badge-blue">${l.action||'—'}</span></td>
      <td class="mono" style="font-size:10px">${l.actor||'—'}</td>
      <td style="font-size:11px">${l.detail||'—'}</td>
    </tr>`).join('');
    document.getElementById('audit-table-wrap').innerHTML=`<table><thead><tr><th>Time</th><th>Action</th><th>Actor</th><th>Detail</th></tr></thead><tbody>${rows}</tbody></table>`;
  }catch(e){ document.getElementById('audit-table-wrap').innerHTML='<div class="empty">Failed to load.</div>'; }
}
</script>
</body>
</html>
